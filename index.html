<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-text-wrap">
          <div class="brand-top-row">
            <h1>Academia</h1>
            <div id="brandUserArea" class="brand-user-area hidden">
              <p id="brandSignedInText" class="brand-signed-in"></p>
              <button id="signOutBtn" class="ghost-btn brand-signout-btn" type="button">Sign Out</button>
            </div>
          </div>
        </div>
      </div>

      <div class="auth-box">
        <div id="authSignedOut">
          <p class="meta strongish">Sign in to sync across devices</p>
          <input type="email" id="authEmail" placeholder="Email">
          <input type="password" id="authPassword" placeholder="Password">
          <div class="auth-btn-row">
            <button id="signUpBtn" class="secondary-btn" type="button">Sign Up</button>
            <button id="signInBtn" class="primary-btn" type="button">Sign In</button>
          </div>
          <p id="authMessage" class="meta"></p>
        </div>

        <div id="authSignedIn" class="hidden">
          <p id="authMessageSignedIn" class="meta"></p>
        </div>
      </div>

      <button id="menuToggleBtn" class="menu-toggle-btn" type="button" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="tab-nav" id="tabNav">
        <button class="tab-btn active" data-tab="dashboard" type="button">Dashboard</button>
        <button class="tab-btn" data-tab="courses" type="button">Courses</button>
        <button class="tab-btn" data-tab="planner" type="button">Tasks</button>
        <button class="tab-btn" data-tab="notes" type="button">Notes</button>
        <button class="tab-btn" data-tab="exams" type="button">Exams</button>
        <button class="tab-btn" data-tab="academic" type="button">Academic Settings</button>
        <button class="tab-btn" data-tab="calendar" type="button">Calendar</button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
      </header>

      <section id="dashboard" class="tab-content active">
        <div class="dashboard-grid dashboard-single-column">
          <div class="panel">
            <div class="panel-head">
              <h3>Upcoming Tasks</h3>
              <button class="secondary-btn open-modal-btn" data-open-modal="taskModal" type="button">Add Task</button>
            </div>
            <div id="dashboardUpcomingTasks"></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h3>Upcoming Exams</h3>
              <button class="secondary-btn open-modal-btn" data-open-modal="examModal" type="button">Add Exam</button>
            </div>
            <div id="dashboardUpcomingExams"></div>
          </div>
        </div>
      </section>

      <section id="courses" class="tab-content">
        <div class="section-head">
          <h3>Courses</h3>
          <button class="primary-btn open-modal-btn" data-open-modal="courseModal" type="button">Add Course</button>
        </div>
        <div id="coursesList" class="card-grid"></div>
      </section>

      <section id="planner" class="tab-content">
        <div class="section-head">
          <h3>Tasks</h3>
          <button class="primary-btn open-modal-btn" data-open-modal="taskModal" type="button">Add Task</button>
        </div>
        <div id="plannerList" class="planner-grid"></div>
      </section>

      <section id="notes" class="tab-content">
        <div class="section-head">
          <h3>Notes</h3>
          <button class="primary-btn open-modal-btn" data-open-modal="noteModal" type="button">Add Note</button>
        </div>
        <div id="notesList" class="card-grid"></div>
      </section>

      <section id="exams" class="tab-content">
        <div class="section-head">
          <h3>Exams</h3>
          <button class="primary-btn open-modal-btn" data-open-modal="examModal" type="button">Add Exam</button>
        </div>
        <div id="examsList" class="planner-grid"></div>
      </section>

      <section id="academic" class="tab-content">
        <div class="section-head">
          <h3>Academic Settings</h3>
          <div class="head-btns">
            <button class="secondary-btn open-modal-btn" data-open-modal="semesterModal" type="button">Add Semester</button>
            <button class="primary-btn open-modal-btn" data-open-modal="academicYearModal" type="button">Add Academic Year</button>
          </div>
        </div>
        <div id="academicYearsList" class="card-grid"></div>
      </section>

      <section id="calendar" class="tab-content">
        <div class="section-head calendar-head">
          <h3>Calendar</h3>
          <div class="calendar-controls">
            <div class="view-switch">
              <button id="monthViewBtn" class="secondary-btn active-view-btn" type="button">Month</button>
              <button id="weekViewBtn" class="secondary-btn" type="button">Week</button>
              <button id="dayViewBtn" class="secondary-btn" type="button">Day</button>
            </div>
            <button id="prevPeriodBtn" class="secondary-btn" type="button">Prev</button>
            <div id="calendarMonthLabel" class="calendar-month-label">Month Year</div>
            <button id="nextPeriodBtn" class="secondary-btn" type="button">Next</button>
          </div>
        </div>

        <div class="calendar-board">
          <div id="monthCalendarWrap">
            <div class="calendar-weekdays">
              <div>Sun</div>
              <div>Mon</div>
              <div>Tue</div>
              <div>Wed</div>
              <div>Thu</div>
              <div>Fri</div>
              <div>Sat</div>
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
          </div>

          <div id="weekCalendarWrap" class="hidden">
            <div id="weekCalendarGrid" class="week-calendar-grid"></div>
          </div>

          <div id="dayCalendarWrap" class="hidden">
            <div id="dayCalendarGrid" class="day-calendar-grid"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal hidden" id="academicYearModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="academicYearModalTitle">Add Academic Year</h3>
        <button class="icon-btn close-modal-btn" data-close-modal="academicYearModal" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="academicYearName" placeholder="Example: 2026 - 2027">
      </div>
      <div class="modal-footer">
        <button class="ghost-btn close-modal-btn" data-close-modal="academicYearModal" type="button">Cancel</button>
        <button id="saveAcademicYearBtn" type="button" class="primary-btn">Save Academic Year</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="semesterModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="semesterModalTitle">Add Semester</h3>
        <button class="icon-btn close-modal-btn" data-close-modal="semesterModal" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <select id="semesterAcademicYear"></select>
        <input type="text" id="semesterName" placeholder="Example: Fall Semester">
        <div class="input-row">
          <input type="date" id="semesterStartDate">
          <input type="date" id="semesterEndDate">
        </div>
      </div>
      <div class="modal-footer">
        <button class="ghost-btn close-modal-btn" data-close-modal="semesterModal" type="button">Cancel</button>
        <button id="saveSemesterBtn" type="button" class="primary-btn">Save Semester</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="courseModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="courseModalTitle">Add Course</h3>
        <button class="icon-btn close-modal-btn" data-close-modal="courseModal" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="courseName" placeholder="Course name">
        <div class="input-row">
          <input type="text" id="courseCode" placeholder="Course code">
          <input type="text" id="courseInstructor" placeholder="Instructor">
          <input type="color" id="courseColor" value="#2563eb">
        </div>
        <select id="courseSemester"></select>
      </div>
      <div class="modal-footer">
        <button class="ghost-btn close-modal-btn" data-close-modal="courseModal" type="button">Cancel</button>
        <button id="saveCourseBtn" type="button" class="primary-btn">Save Course</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="noteModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="noteModalTitle">Add Note</h3>
        <button class="icon-btn close-modal-btn" data-close-modal="noteModal" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="noteTitle" placeholder="Note title">
        <textarea id="noteContent" rows="12" placeholder="Write your notes here..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="ghost-btn close-modal-btn" data-close-modal="noteModal" type="button">Cancel</button>
        <button id="saveNoteBtn" type="button" class="primary-btn">Save Note</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="taskModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="taskModalTitle">Add Task</h3>
        <button class="icon-btn close-modal-btn" data-close-modal="taskModal" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="taskTitle" placeholder="Task title">
        <textarea id="taskDetails" placeholder="Task details"></textarea>
        <select id="taskCourse"></select>
        <div class="input-row">
          <input type="date" id="taskDate">
          <select id="taskPriority">
            <option value="High">High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>
          </select>
          <select id="taskStatus">
            <option value="To Do">To Do</option>
            <option value="In Progress">In Progress</option>
            <option value="Done">Done</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="ghost-btn close-modal-btn" data-close-modal="taskModal" type="button">Cancel</button>
        <button id="addTaskBtn" type="button" class="primary-btn">Save Task</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="examModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="examModalTitle">Add Exam</h3>
        <button class="icon-btn close-modal-btn" data-close-modal="examModal" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="examTitle" placeholder="Exam title">
        <input type="text" id="examCourse" placeholder="Course / subject">
        <div class="input-row">
          <input type="date" id="examDate">
          <input type="time" id="examTime">
          <input type="text" id="examPlace" placeholder="Place">
        </div>
        <div class="input-row">
          <input type="text" id="examSeatNumber" placeholder="Seat number">
          <input type="text" id="examGrade" placeholder="Grade (optional)">
          <input type="number" id="examMark" placeholder="Mark (optional)">
        </div>
        <textarea id="examNotes" placeholder="Revision notes / reminders"></textarea>
      </div>
      <div class="modal-footer">
        <button class="ghost-btn close-modal-btn" data-close-modal="examModal" type="button">Cancel</button>
        <button id="saveExamBtn" type="button" class="primary-btn">Save Exam</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="detailModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="detailTitle">Item Details</h3>
        <button class="icon-btn close-modal-btn" data-close-modal="detailModal" type="button">&times;</button>
      </div>
      <div class="modal-body detail-stack" id="detailBody"></div>
      <div class="modal-footer">
        <button class="primary-btn close-modal-btn" data-close-modal="detailModal" type="button">Close</button>
      </div>
    </div>
  </div>
</body>
</html>
