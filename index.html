<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Planner Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js"></script>
</head>
<body>
  <div class="app">
    <h1>Student Planner Dashboard</h1>
    <p class="subtitle">Track courses, notes, tasks, and events in one place.</p>

    <section class="dashboard-summary">
      <div class="summary-card">
        <h3>Total Courses</h3>
        <p id="totalCourses">0</p>
      </div>
      <div class="summary-card">
        <h3>Total Tasks</h3>
        <p id="totalTasks">0</p>
      </div>
      <div class="summary-card">
        <h3>Total Events</h3>
        <p id="totalEvents">0</p>
      </div>
    </section>

    <div class="tabs">
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="courses">Courses</button>
      <button class="tab-btn" data-tab="notes">Notes</button>
      <button class="tab-btn" data-tab="planner">Planner</button>
      <button class="tab-btn" data-tab="calendar">Calendar</button>
    </div>

    <section id="dashboard" class="tab-content active">
      <h2>Dashboard</h2>
      <p>Use the tabs above to manage courses, notes, tasks, and your schedule.</p>
    </section>

    <section id="courses" class="tab-content">
      <h2>Courses</h2>

      <div class="course-form">
        <div class="input-row">
          <input type="text" id="courseName" placeholder="Course name">
          <input type="text" id="courseCode" placeholder="Course code">
          <input type="text" id="courseInstructor" placeholder="Instructor">
          <input type="color" id="courseColor" value="#2563eb">
        </div>

        <h3>Add Session</h3>

        <div class="input-row">
          <select id="sessionType">
            <option value="Lecture">Lecture</option>
            <option value="Lab">Lab</option>
            <option value="Tutorial">Tutorial</option>
            <option value="Seminar">Seminar</option>
          </select>

          <select id="sessionRepeat">
            <option value="weekly">Weekly</option>
            <option value="specific">Specific Date</option>
          </select>

          <select id="sessionDay">
            <option value="">Day</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>

          <input type="date" id="sessionDate">
          <input type="time" id="sessionStartTime">
          <input type="time" id="sessionEndTime">
          <button id="addSessionBtn" type="button">Add Session</button>
        </div>

        <ul id="pendingSessionsList"></ul>

        <button id="saveCourseBtn" type="button">Save Course</button>
      </div>

      <div id="coursesList"></div>
    </section>

    <section id="notes" class="tab-content">
      <h2>Notes</h2>
      <div class="notes-form">
        <input type="text" id="noteTitle" placeholder="Note title">
        <textarea id="noteContent" placeholder="Write your notes here..."></textarea>
        <button id="saveNoteBtn" type="button">Save Note</button>
      </div>
      <div id="notesList"></div>
    </section>

    <section id="planner" class="tab-content">
      <h2>Planner</h2>
      <div class="input-row">
        <input type="text" id="taskTitle" placeholder="Task title">
        <input type="date" id="taskDate">
        <select id="taskPriority">
          <option value="High">High Priority</option>
          <option value="Medium">Medium Priority</option>
          <option value="Low">Low Priority</option>
        </select>
        <select id="taskStatus">
          <option value="To Do">To Do</option>
          <option value="Doing">Doing</option>
          <option value="Done">Done</option>
        </select>
        <button id="addTaskBtn" type="button">Add Task</button>
      </div>
      <div id="plannerList" class="planner-grid"></div>
    </section>

    <section id="calendar" class="tab-content">
      <h2>Calendar</h2>

      <div class="event-form">
        <div class="input-row">
          <input type="text" id="eventTitle" placeholder="Event title">
          <input type="date" id="eventDate">
          <input type="time" id="eventStartTime">
          <input type="time" id="eventEndTime">
          <button id="saveEventBtn" type="button">Save Event</button>
        </div>
      </div>

      <div id="calendarView"></div>

      <div class="custom-events-section">
        <h3>Custom Events</h3>
        <div id="eventsList"></div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
