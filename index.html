<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-text">
          <h1>Academia</h1>
          <p class="muted">Signed in as <span id="userEmail">Guest</span></p>
        </div>

        <button
          id="menuToggleBtn"
          class="menu-toggle hamburger-btn"
          type="button"
          aria-label="Open menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <nav id="tabNav" class="tab-nav">
        <button class="tab-btn active" data-tab="dashboardTab" type="button">Dashboard</button>
        <button class="tab-btn" data-tab="calendarTab" type="button">Calendar</button>
        <button class="tab-btn" data-tab="coursesTab" type="button">Courses</button>
        <button class="tab-btn" data-tab="tasksTab" type="button">Tasks</button>
        <button class="tab-btn" data-tab="notesTab" type="button">Notes</button>
        <button class="tab-btn" data-tab="academicTab" type="button">Academic</button>
      </nav>

      <div class="auth-card">
        <button id="signOutBtn" class="secondary-btn" type="button">Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h2 id="pageTitle">Dashboard</h2>
      </header>

      <section id="dashboardTab" class="tab-content active">
        <div class="grid-2">
          <div class="panel">
            <div class="panel-head">
              <h3>Upcoming tasks</h3>
            </div>
            <div id="dashboardTasks" class="stack-list"></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h3>Upcoming events</h3>
            </div>
            <div id="dashboardEvents" class="stack-list"></div>
          </div>
        </div>
      </section>

      <section id="calendarTab" class="tab-content">
        <div class="panel">
          <div class="calendar-toolbar">
            <!-- Row 1: Add Event, top-right -->
            <div class="calendar-top-actions">
              <button id="addEventBtn" class="primary-btn calendar-add-btn" type="button">
                Add Event
              </button>
            </div>

            <!-- Row 2: Previous, month/year, Next -->
            <div class="calendar-nav-row">
              <button id="prevPeriodBtn" class="secondary-btn" type="button">Previous</button>
              <h3 id="calendarTitle">Month Year</h3>
              <button id="nextPeriodBtn" class="secondary-btn" type="button">Next</button>
            </div>

            <!-- Row 3: Month, Week, Day -->
            <div class="calendar-view-actions">
              <button id="monthViewBtn" class="secondary-btn active-view-btn" type="button">Month</button>
              <button id="weekViewBtn" class="secondary-btn" type="button">Week</button>
              <button id="dayViewBtn" class="secondary-btn" type="button">Day</button>
            </div>
          </div>

          <div id="calendarWeekdays" class="calendar-weekdays"></div>
          <div id="calendarGrid" class="calendar-grid"></div>
          <div id="weekCalendarGrid" class="week-calendar-grid hidden"></div>
          <div id="dayViewContainer" class="day-view-card hidden"></div>
        </div>
      </section>

      <section id="coursesTab" class="tab-content">
        <div class="section-toolbar">
          <h2>Courses</h2>
          <button id="addCourseBtn" class="primary-btn" type="button">Add Course</button>
        </div>
        <div id="coursesList" class="cards-grid-3"></div>
      </section>

      <section id="tasksTab" class="tab-content">
        <div class="section-toolbar">
          <h2>Tasks</h2>
          <button id="addTaskBtn" class="primary-btn" type="button">Add Task</button>
        </div>
        <div id="tasksList" class="cards-grid-3"></div>
      </section>

      <section id="notesTab" class="tab-content">
        <div class="section-toolbar">
          <h2>Notes</h2>
          <button id="addNoteBtn" class="primary-btn" type="button">Add Note</button>
        </div>
        <div id="notesList" class="cards-grid-3"></div>
      </section>

      <section id="academicTab" class="tab-content">
        <div class="section-toolbar">
          <h2>Academic</h2>
          <button id="addAcademicBtn" class="primary-btn" type="button">Add Academic Item</button>
        </div>
        <div id="academicList" class="cards-grid-2"></div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card large">
      <div class="modal-head">
        <h2 id="modalTitle">Add Item</h2>
        <button id="closeModalBtn" class="icon-btn" type="button">Close</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
