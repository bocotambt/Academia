<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-text">
          <h1>Academia</h1>
          <p id="brandSignedInText" class="muted small"></p>
        </div>

        <button id="menuToggleBtn" class="menu-toggle hamburger-btn" type="button" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <div id="brandUserArea" class="hidden"></div>

      <nav id="tabNav" class="tab-nav">
        <button class="tab-btn active" data-tab="dashboard" type="button">Dashboard</button>
        <button class="tab-btn" data-tab="courses" type="button">Courses</button>
        <button class="tab-btn" data-tab="planner" type="button">Tasks</button>
        <button class="tab-btn" data-tab="notes" type="button">Notes</button>
        <button class="tab-btn" data-tab="exams" type="button">Exams</button>
        <button class="tab-btn" data-tab="holidays" type="button">Holidays</button>
        <button class="tab-btn" data-tab="academic" type="button">Academic Settings</button>
        <button class="tab-btn" data-tab="calendar" type="button">Calendar</button>
      </nav>

      <div class="auth-card">
        <div id="authSignedOut">
          <h3>Sign in</h3>
          <input id="authEmail" type="email" placeholder="Email">
          <input id="authPassword" type="password" placeholder="Password">
          <div class="row">
            <button id="signUpBtn" class="secondary-btn" type="button">Sign Up</button>
            <button id="signInBtn" class="primary-btn" type="button">Sign In</button>
          </div>
          <p id="authMessage" class="muted small"></p>
        </div>

        <button id="signOutBtn" class="danger-btn hidden" type="button">Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h2 id="pageTitle">Dashboard</h2>
      </header>

      <section id="dashboard" class="tab-content active">
        <div class="grid-2">
          <div class="panel">
            <div class="panel-head">
              <h3>Today</h3>
            </div>
            <div id="dashboardToday"></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h3>Tomorrow</h3>
            </div>
            <div id="dashboardTomorrow"></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="panel">
            <div class="panel-head">
              <h3>Upcoming Tasks</h3>
            </div>
            <div id="dashboardUpcomingTasks"></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h3>Upcoming Exams</h3>
            </div>
            <div id="dashboardUpcomingExams"></div>
          </div>
        </div>
      </section>

      <section id="courses" class="tab-content">
        <div class="section-toolbar">
          <button class="primary-btn" data-open-modal="courseModal" type="button">Add Course</button>
        </div>
        <div id="coursesList" class="stack-list"></div>
      </section>

      <section id="planner" class="tab-content">
        <div class="section-toolbar">
          <button class="primary-btn" data-open-modal="taskModal" type="button">Add Task</button>
        </div>
        <div id="plannerList" class="stack-list"></div>
      </section>

      <section id="notes" class="tab-content">
        <div class="section-toolbar">
          <button class="primary-btn" data-open-modal="noteModal" type="button">Add Note</button>
        </div>
        <div id="notesList" class="stack-list"></div>
      </section>

      <section id="exams" class="tab-content">
        <div class="section-toolbar">
          <button class="primary-btn" data-open-modal="examModal" type="button">Add Exam</button>
        </div>
        <div id="examsList" class="stack-list"></div>
      </section>

      <section id="holidays" class="tab-content">
        <div class="section-toolbar">
          <button class="primary-btn" data-open-modal="holidayModal" type="button">Add Holiday</button>
        </div>
        <div id="holidaysList" class="stack-list"></div>
      </section>

      <section id="academic" class="tab-content">
        <div class="section-toolbar">
          <button class="primary-btn" data-open-modal="academicYearModal" type="button">Add Academic Year</button>
          <button class="secondary-btn" data-open-modal="semesterModal" type="button">Add Semester</button>
        </div>
        <div id="academicYearsList" class="stack-list"></div>
      </section>

      <section id="calendar" class="tab-content">
        <div class="panel">
          <div class="calendar-toolbar">
            <div class="calendar-nav-row">
              <button id="prevPeriodBtn" class="secondary-btn" type="button">Previous</button>
              <h3 id="calendarMonthLabel">Calendar</h3>
              <button id="nextPeriodBtn" class="secondary-btn" type="button">Next</button>
            </div>

            <div class="calendar-view-actions">
              <button id="monthViewBtn" class="secondary-btn active-view-btn" type="button">Month</button>
              <button id="weekViewBtn" class="secondary-btn" type="button">Week</button>
              <button id="dayViewBtn" class="secondary-btn" type="button">Day</button>
              <button class="primary-btn calendar-add-btn" data-open-modal="eventModal" type="button">Add Event</button>
            </div>
          </div>

          <div id="monthCalendarWrap">
            <div class="calendar-weekdays">
              <div>Sun</div>
              <div>Mon</div>
              <div>Tue</div>
              <div>Wed</div>
              <div>Thu</div>
              <div>Fri</div>
              <div>Sat</div>
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
          </div>

          <div id="weekCalendarWrap" class="hidden">
            <div id="weekCalendarGrid" class="week-calendar-grid"></div>
          </div>

          <div id="dayCalendarWrap" class="hidden">
            <div id="dayCalendarGrid" class="day-calendar-grid"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="detailModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="detailTitle">Details</h3>
        <button class="icon-btn" data-close-modal="detailModal" type="button">✕</button>
      </div>
      <div id="detailBody" class="modal-body"></div>
      <div id="detailActions" class="modal-actions hidden">
        <button id="detailEditBtn" class="secondary-btn" type="button">Edit</button>
        <button id="detailDeleteBtn" class="danger-btn" type="button">Delete</button>
      </div>
    </div>
  </div>

  <div id="courseModal" class="modal hidden">
    <div class="modal-card large">
      <div class="modal-head">
        <h3>Course</h3>
        <button class="icon-btn" data-close-modal="courseModal" type="button">✕</button>
      </div>
      <div class="modal-body form-grid">
        <input id="courseName" type="text" placeholder="Course name">
        <input id="courseCode" type="text" placeholder="Course code">
        <input id="courseInstructor" type="text" placeholder="Instructor name">

        <div class="color-row">
          <input id="courseColor" type="color" value="#2563eb">
          <span id="courseColorPreview" class="color-preview"></span>
        </div>

        <select id="courseSemester"></select>

        <div class="subpanel">
          <h4>Add Session</h4>

          <select id="sessionType">
            <option value="">Choose session type</option>
            <option value="Lecture">Lecture</option>
            <option value="Lab">Lab</option>
            <option value="Tutorial">Tutorial</option>
            <option value="Seminar">Seminar</option>
            <option value="Workshop">Workshop</option>
            <option value="Discussion">Discussion</option>
            <option value="Office Hours">Office Hours</option>
            <option value="Other">Other</option>
          </select>

          <select id="sessionRepeat">
            <option value="">Choose repeat rule</option>
            <option value="weekly">Weekly</option>
            <option value="specific">Specific dates</option>
          </select>

          <div id="sessionDayWrap" class="hidden">
            <select id="sessionDay">
              <option value="">Choose day</option>
              <option value="Sunday">Sunday</option>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
            </select>
          </div>

          <div id="sessionDatesWrap" class="hidden">
            <div class="row">
              <input id="sessionDate" type="date">
              <button id="addSpecificDateBtn" class="secondary-btn" type="button">Add Date</button>
            </div>
            <div id="pendingSpecificDates"></div>
          </div>

          <div class="row">
            <input id="sessionStartTime" type="time">
            <input id="sessionEndTime" type="time">
          </div>

          <input id="sessionLocation" type="text" placeholder="Location">
          <button id="addSessionBtn" class="secondary-btn" type="button">Add Session</button>

          <div id="pendingSessionsList"></div>
        </div>

        <button id="saveCourseBtn" class="primary-btn" type="button">Save Course</button>
      </div>
    </div>
  </div>

  <div id="taskModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Task</h3>
        <button class="icon-btn" data-close-modal="taskModal" type="button">✕</button>
      </div>
      <div class="modal-body form-grid">
        <input id="taskTitle" type="text" placeholder="Task title">
        <textarea id="taskDetails" placeholder="Task details"></textarea>
        <select id="taskCourse"></select>
        <input id="taskDate" type="date">

        <select id="taskPriority">
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>

        <select id="taskStatus">
          <option>To Do</option>
          <option>In Progress</option>
          <option>Done</option>
        </select>

        <button id="addTaskBtn" class="primary-btn" type="button">Save Task</button>
      </div>
    </div>
  </div>

  <div id="noteModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Note</h3>
        <button class="icon-btn" data-close-modal="noteModal" type="button">✕</button>
      </div>
      <div class="modal-body form-grid">
        <input id="noteTitle" type="text" placeholder="Note title">
        <select id="noteCourse">
          <option value="">No course</option>
        </select>

        <div class="color-row">
          <input id="noteColor" type="color" value="#7c3aed">
          <span id="noteColorPreview" class="color-preview"></span>
        </div>

        <textarea id="noteContent" placeholder="Write your note"></textarea>
        <button id="saveNoteBtn" class="primary-btn" type="button">Save Note</button>
      </div>
    </div>
  </div>

  <div id="examModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Exam</h3>
        <button class="icon-btn" data-close-modal="examModal" type="button">✕</button>
      </div>
      <div class="modal-body form-grid">
        <input id="examTitle" type="text" placeholder="Exam title">
        <select id="examCourse"></select>
        <input id="examDate" type="date">
        <input id="examTime" type="time">
        <input id="examDuration" type="number" placeholder="Duration in minutes">
        <input id="examPlace" type="text" placeholder="Place">
        <input id="examSeatNumber" type="text" placeholder="Seat number">
        <input id="examGrade" type="text" placeholder="Grade">
        <input id="examMark" type="number" placeholder="Mark">
        <textarea id="examNotes" placeholder="Exam notes"></textarea>
        <button id="saveExamBtn" class="primary-btn" type="button">Save Exam</button>
      </div>
    </div>
  </div>

  <div id="holidayModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Holiday</h3>
        <button class="icon-btn" data-close-modal="holidayModal" type="button">✕</button>
      </div>
      <div class="modal-body form-grid">
        <input id="holidayTitle" type="text" placeholder="Holiday name">
        <input id="holidayStartDate" type="date">
        <input id="holidayEndDate" type="date">
        <button id="saveHolidayBtn" class="primary-btn" type="button">Save Holiday</button>
      </div>
    </div>
  </div>

  <div id="eventModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Event</h3>
        <button class="icon-btn" data-close-modal="eventModal" type="button">✕</button>
      </div>
      <div class="modal-body form-grid">
        <input id="eventTitle" type="text" placeholder="Event title">
        <input id="eventDate" type="date">
        <input id="eventStartTime" type="time">
        <input id="eventEndTime" type="time">
        <input id="eventLocation" type="text" placeholder="Location">
        <textarea id="eventDetails" placeholder="Event details"></textarea>

        <div class="color-row">
          <input id="eventColor" type="color" value="#7c3aed">
          <span id="eventColorPreview" class="color-preview"></span>
        </div>

        <button id="saveEventBtn" class="primary-btn" type="button">Save Event</button>
      </div>
    </div>
  </div>

  <div id="academicYearModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Academic Year</h3>
        <button class="icon-btn" data-close-modal="academicYearModal" type="button">✕</button>
      </div>
      <div class="modal-body form-grid">
        <input id="academicYearName" type="text" placeholder="Academic year name">
        <button id="saveAcademicYearBtn" class="primary-btn" type="button">Save Academic Year</button>
      </div>
    </div>
  </div>

  <div id="semesterModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Semester</h3>
        <button class="icon-btn" data-close-modal="semesterModal" type="button">✕</button>
      </div>
      <div class="modal-body form-grid">
        <select id="semesterAcademicYear"></select>
        <input id="semesterName" type="text" placeholder="Semester name">
        <input id="semesterStartDate" type="date">
        <input id="semesterEndDate" type="date">
        <button id="saveSemesterBtn" class="primary-btn" type="button">Save Semester</button>
      </div>
    </div>
  </div>
</body>
</html>
