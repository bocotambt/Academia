<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academia</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <h1>Academia</h1>
          <p class="brand-subtitle">Study dashboard</p>
        </div>

        <button id="menuToggleBtn" class="menu-toggle-btn" type="button" aria-label="Open menu">
          ☰
        </button>

        <div id="brandUserArea" class="brand-user-area hidden">
          <p id="brandSignedInText" class="brand-signed-in"></p>
        </div>
      </div>

      <div id="authBox" class="auth-box">
        <div id="authSignedOut">
          <input id="authEmail" type="email" placeholder="Email" />
          <input id="authPassword" type="password" placeholder="Password" />
          <div class="auth-actions">
            <button id="signUpBtn" class="secondary-btn" type="button">Sign Up</button>
            <button id="signInBtn" class="primary-btn" type="button">Sign In</button>
          </div>
          <p id="authMessage" class="auth-message"></p>
        </div>

        <div id="authSignedIn" class="hidden">
          <p id="authMessageSignedIn" class="auth-message"></p>
        </div>
      </div>

      <nav id="tabNav" class="tab-nav">
        <button class="tab-btn active" data-tab="dashboard" type="button">Dashboard</button>
        <button class="tab-btn" data-tab="courses" type="button">Courses</button>
        <button class="tab-btn" data-tab="planner" type="button">Tasks</button>
        <button class="tab-btn" data-tab="notes" type="button">Notes</button>
        <button class="tab-btn" data-tab="exams" type="button">Exams</button>
        <button class="tab-btn" data-tab="calendar" type="button">Calendar</button>
        <button class="tab-btn" data-tab="academic" type="button">Academic Settings</button>
      </nav>

      <button id="signOutBtn" class="brand-signout-btn hidden" type="button">Sign Out</button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h2 id="pageTitle">Dashboard</h2>
      </header>

      <section id="dashboard" class="tab-content active">
        <div class="dashboard-grid">
          <div class="panel">
            <div class="panel-header">
              <h3>Today's Schedule</h3>
            </div>
            <div id="dashboardToday"></div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h3>Tomorrow's Schedule</h3>
            </div>
            <div id="dashboardTomorrow"></div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h3>Upcoming Tasks</h3>
            </div>
            <div id="dashboardUpcomingTasks"></div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h3>Upcoming Exams</h3>
            </div>
            <div id="dashboardUpcomingExams"></div>
          </div>
        </div>
      </section>

      <section id="courses" class="tab-content">
        <div class="section-header">
          <h3>Courses</h3>
          <button class="open-modal-btn primary-btn" data-open-modal="courseModal" type="button">
            Add Course
          </button>
        </div>
        <div id="coursesList"></div>
      </section>

      <section id="planner" class="tab-content">
        <div class="section-header">
          <h3>Tasks</h3>
          <button class="open-modal-btn primary-btn" data-open-modal="taskModal" type="button">
            Add Task
          </button>
        </div>
        <div id="plannerList"></div>
      </section>

      <section id="notes" class="tab-content">
        <div class="section-header">
          <h3>Notes</h3>
          <button class="open-modal-btn primary-btn" data-open-modal="noteModal" type="button">
            Add Note
          </button>
        </div>
        <div id="notesList"></div>
      </section>

      <section id="exams" class="tab-content">
        <div class="section-header">
          <h3>Exams</h3>
          <button class="open-modal-btn primary-btn" data-open-modal="examModal" type="button">
            Add Exam
          </button>
        </div>
        <div id="examsList"></div>
      </section>

      <section id="calendar" class="tab-content">
        <div class="section-header">
          <h3>Calendar</h3>
          <div class="calendar-top-actions">
            <button class="open-modal-btn primary-btn" data-open-modal="eventModal" type="button">
              Add Event
            </button>
          </div>
        </div>

        <div class="calendar-toolbar">
          <div class="calendar-nav">
            <button id="prevPeriodBtn" class="secondary-btn" type="button">←</button>
            <h3 id="calendarMonthLabel">Calendar</h3>
            <button id="nextPeriodBtn" class="secondary-btn" type="button">→</button>
          </div>

          <div class="calendar-view-switch">
            <button id="monthViewBtn" class="secondary-btn active-view-btn" type="button">Month</button>
            <button id="weekViewBtn" class="secondary-btn" type="button">Week</button>
            <button id="dayViewBtn" class="secondary-btn" type="button">Day</button>
          </div>
        </div>

        <div id="monthCalendarWrap">
          <div class="calendar-weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <div id="weekCalendarWrap" class="hidden">
          <div id="weekCalendarGrid" class="week-calendar-grid"></div>
        </div>

        <div id="dayCalendarWrap" class="hidden">
          <div id="dayCalendarGrid" class="day-calendar-grid"></div>
        </div>
      </section>

      <section id="academic" class="tab-content">
        <div class="section-header">
          <h3>Academic Settings</h3>
          <div class="section-actions">
            <button class="open-modal-btn secondary-btn" data-open-modal="academicYearModal" type="button">
              Add Academic Year
            </button>
            <button class="open-modal-btn primary-btn" data-open-modal="semesterModal" type="button">
              Add Semester
            </button>
          </div>
        </div>
        <div id="academicYearsList"></div>
      </section>
    </main>
  </div>

  <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Details">
    <div class="modal-content">
      <button class="close-modal-btn" data-close-modal="detailModal" type="button">✕</button>
      <h2 id="detailTitle">Details</h2>
      <div id="detailBody"></div>
    </div>
  </div>

  <div id="academicYearModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Academic year">
    <div class="modal-content">
      <button class="close-modal-btn" data-close-modal="academicYearModal" type="button">✕</button>
      <h2>Academic Year</h2>
      <label for="academicYearName">Academic year name</label>
      <input id="academicYearName" type="text" placeholder="2026/2027" />
      <button id="saveAcademicYearBtn" class="primary-btn" type="button">Save Academic Year</button>
    </div>
  </div>

  <div id="semesterModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Semester">
    <div class="modal-content">
      <button class="close-modal-btn" data-close-modal="semesterModal" type="button">✕</button>
      <h2>Semester</h2>

      <label for="semesterAcademicYear">Academic year</label>
      <select id="semesterAcademicYear"></select>

      <label for="semesterName">Semester name</label>
      <input id="semesterName" type="text" placeholder="Fall Semester" />

      <label for="semesterStartDate">Start date</label>
      <input id="semesterStartDate" type="date" />

      <label for="semesterEndDate">End date</label>
      <input id="semesterEndDate" type="date" />

      <button id="saveSemesterBtn" class="primary-btn" type="button">Save Semester</button>
    </div>
  </div>

  <div id="courseModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Course">
    <div class="modal-content">
      <button class="close-modal-btn" data-close-modal="courseModal" type="button">✕</button>
      <h2>Course</h2>

      <label for="courseName">Course name</label>
      <input id="courseName" type="text" placeholder="Biology 101" />

      <label for="courseCode">Course code</label>
      <input id="courseCode" type="text" placeholder="BIO101" />

      <label for="courseInstructor">Instructor</label>
      <input id="courseInstructor" type="text" placeholder="Dr. Smith" />

      <label for="courseColor">Course color</label>
      <input id="courseColor" type="color" value="#2563eb" />

      <label for="courseSemester">Semester</label>
      <select id="courseSemester"></select>

      <hr />

      <h3>Add Session</h3>

      <label for="sessionType">Session type</label>
      <select id="sessionType">
        <option value="">Choose session type</option>
        <option value="Lecture">Lecture</option>
        <option value="Tutorial">Tutorial</option>
        <option value="Lab">Lab</option>
        <option value="Seminar">Seminar</option>
      </select>

      <label for="sessionRepeat">Repeat</label>
      <select id="sessionRepeat">
        <option value="">Choose repeat type</option>
        <option value="weekly">Weekly</option>
        <option value="specific">Specific date</option>
      </select>

      <label for="sessionDay">Day of week</label>
      <select id="sessionDay">
        <option value="">Choose a day</option>
        <option value="Sunday">Sunday</option>
        <option value="Monday">Monday</option>
        <option value="Tuesday">Tuesday</option>
        <option value="Wednesday">Wednesday</option>
        <option value="Thursday">Thursday</option>
        <option value="Friday">Friday</option>
        <option value="Saturday">Saturday</option>
      </select>

      <label for="sessionDate">Specific date</label>
      <input id="sessionDate" type="date" />

      <label for="sessionStartTime">Start time</label>
      <input id="sessionStartTime" type="time" />

      <label for="sessionEndTime">End time</label>
      <input id="sessionEndTime" type="time" />

      <label for="sessionLocation">Location</label>
      <input id="sessionLocation" type="text" placeholder="Room 301" />

      <button id="addSessionBtn" class="secondary-btn" type="button">Add Session</button>

      <div id="pendingSessionsList" class="pending-sessions-list"></div>

      <button id="saveCourseBtn" class="primary-btn" type="button">Save Course</button>
    </div>
  </div>

  <div id="taskModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Task">
    <div class="modal-content">
      <button class="close-modal-btn" data-close-modal="taskModal" type="button">✕</button>
      <h2>Task</h2>

      <label for="taskTitle">Task title</label>
      <input id="taskTitle" type="text" placeholder="Finish assignment" />

      <label for="taskDetails">Details</label>
      <textarea id="taskDetails" rows="4" placeholder="Task instructions or reminders"></textarea>

      <label for="taskCourse">Course</label>
      <select id="taskCourse"></select>

      <label for="taskDate">Due date</label>
      <input id="taskDate" type="date" />

      <label for="taskPriority">Priority</label>
      <select id="taskPriority">
        <option value="">Choose priority</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>

      <label for="taskStatus">Status</label>
      <select id="taskStatus">
        <option value="">Choose status</option>
        <option value="To Do">To Do</option>
        <option value="In Progress">In Progress</option>
        <option value="Done">Done</option>
      </select>

      <button id="addTaskBtn" class="primary-btn" type="button">Save Task</button>
    </div>
  </div>

  <div id="noteModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Note">
    <div class="modal-content">
      <button class="close-modal-btn" data-close-modal="noteModal" type="button">✕</button>
      <h2>Note</h2>

      <label for="noteTitle">Title</label>
      <input id="noteTitle" type="text" placeholder="Lecture notes" />

      <label for="noteContent">Content</label>
      <textarea id="noteContent" rows="6" placeholder="Write your notes here"></textarea>

      <button id="saveNoteBtn" class="primary-btn" type="button">Save Note</button>
    </div>
  </div>

  <div id="examModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Exam">
    <div class="modal-content">
      <button class="close-modal-btn" data-close-modal="examModal" type="button">✕</button>
      <h2>Exam</h2>

      <label for="examTitle">Exam title</label>
      <input id="examTitle" type="text" placeholder="Midterm Exam" />

      <label for="examCourse">Course</label>
      <input id="examCourse" type="text" placeholder="Biology 101" />

      <label for="examDate">Date</label>
      <input id="examDate" type="date" />

      <label for="examTime">Time</label>
      <input id="examTime" type="time" />

      <label for="examPlace">Place</label>
      <input id="examPlace" type="text" placeholder="Hall A" />

      <label for="examSeatNumber">Seat number</label>
      <input id="examSeatNumber" type="text" placeholder="A12" />

      <label for="examGrade">Grade</label>
      <input id="examGrade" type="text" placeholder="A" />

      <label for="examMark">Mark</label>
      <input id="examMark" type="number" placeholder="92" />

      <label for="examNotes">Notes</label>
      <textarea id="examNotes" rows="4" placeholder="Revision notes"></textarea>

      <button id="saveExamBtn" class="primary-btn" type="button">Save Exam</button>
    </div>
  </div>

  <div id="eventModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Event">
    <div class="modal-content">
      <button class="close-modal-btn" data-close-modal="eventModal" type="button">✕</button>
      <h2>Event</h2>

      <label for="eventTitle">Title</label>
      <input id="eventTitle" type="text" placeholder="Seminar, meeting, club activity" />

      <label for="eventDate">Date</label>
      <input id="eventDate" type="date" />

      <label for="eventStartTime">Start time</label>
      <input id="eventStartTime" type="time" />

      <label for="eventEndTime">End time</label>
      <input id="eventEndTime" type="time" />

      <label for="eventLocation">Location</label>
      <input id="eventLocation" type="text" placeholder="Room, building, Zoom link" />

      <label for="eventDetails">Details</label>
      <textarea id="eventDetails" rows="4" placeholder="Agenda, reminders, notes"></textarea>

      <button id="saveEventBtn" class="primary-btn" type="button">Save Event</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
