<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirming sign-in...</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .card {
      width: min(92vw, 520px);
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    p {
      line-height: 1.6;
    }

    a {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Confirming your account…</h1>
    <p id="message">Please wait while we verify your email.</p>
    <p><a href="https://bocotambt.github.io/Academia/">Back to Academia</a></p>
  </div>

  <script>
    const SUPABASE_URL = "https://fdijdgvsqfzgzzwlvqff.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qkCIilGuoTE3FgWWzeqKLw_4R9ERznE";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const message = document.getElementById("message");
    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get("token_hash");
    const type = params.get("type") || "email";

    async function confirmEmail() {
      if (!tokenHash) {
        message.textContent = "Missing confirmation token. Please try the email link again.";
        return;
      }

      const { error } = await supabase.auth.verifyOtp({
        token_hash: tokenHash,
        type: type
      });

      if (error) {
        message.textContent = "Confirmation failed: " + error.message;
        return;
      }

      message.textContent = "Email confirmed. Redirecting you back to the app...";
      setTimeout(function () {
        window.location.href = "https://bocotambt.github.io/Academia/";
      }, 1500);
    }

    confirmEmail();
  </script>
</body>
</html>
